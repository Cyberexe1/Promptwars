name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes accessibility and security rules)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tests with enforced coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Real-browser accessibility audit
        run: npm run audit:a11y
        env:
          BROWSER_PATH: /usr/bin/google-chrome

      - name: Browser end-to-end test
        run: npm run e2e
        env:
          BROWSER_PATH: /usr/bin/google-chrome
